defaultIndent: "    "

modifyLineBreaks:
  preserveBlankLines: 1
  condenseMultipleBlankLinesInto: 1
  textWrapOptions:
    columns: 80
    when: after
    multipleSpacesToSingle: 1
    removeBlockLineBreaks: 1
    comments:
      wrap: 1
      inheritLeadingSpace: 1

lookForAlignDelims:
  tabular:
    delims: 1
    alignDoubleBackSlash: 1
    spacesBeforeDoubleBackSlash: 1
    spacesAfterDoubleBackSlash: 0
  tabularx:
    delims: 1
    alignDoubleBackSlash: 1
    spacesBeforeDoubleBackSlash: 1
    spacesAfterDoubleBackSlash: 0
  align:
    delims: 1
    alignDoubleBackSlash: 1

verbatimEnvironments:
  verbatim: 1
  lstlisting: 1
  minted: 1
